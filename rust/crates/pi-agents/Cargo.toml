[package]
name = "pi-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic micro-agent core for the PI Platform (Rust port)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"

[dev-dependencies]
# Serializes tests that mutate process-global env vars (PI_*_STRICT_MODE),
# preventing flaky failures under cargo's default parallel test execution.
serial_test = "3"
