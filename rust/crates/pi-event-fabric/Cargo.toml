[package]
name = "pi-event-fabric"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic append-only event bus (Rust port of pi_event_fabric.bus.core)."

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: keep JSON object insertion order (Python dict semantics) for
# fields like GovernanceViolation context.payload_keys = list(payload.keys()).
# Canonical hashing sorts keys explicitly, so this does not affect hashes.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
