name: CI — Test, Lint, Conformance

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Pin the hash seed so set/dict iteration order is reproducible across runs —
# the platform's byte-identical-output / replay guarantee assumes this, and it
# makes determinism regressions deterministically catchable in CI.
env:
  PYTHONHASHSEED: "0"

# Cancel superseded runs on the same ref so a fast follow-up push doesn't
# burn doubled minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA (resolved 2026-05-24):
#   actions/checkout@v4     → 34e114876b0b11c390a56381ad16ebd13914f8d5
#   actions/setup-python@v5 → a26af69be951a213d495a4c3e4e4022e16d87065
# Refresh by re-running `curl https://api.github.com/repos/<owner>/<repo>/git/refs/tags/<tag>`.

jobs:
  test-core:
    name: Core Runtimes Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,all]"
      - name: Run tests with coverage gate
        # Coverage is measured across the full functional suite (not tests/unit alone):
        # most of src/ is exercised by integration/conformance/console tests, so scoping
        # --cov=src to unit-only made the 60% gate unreachable (41%) despite real coverage.
        # Full-suite coverage is ~78%.
        run: |
          PYTHONPATH=src python -m pytest \
            tests/unit tests/integration tests/conformance tests/console tests/ledger tests/pipeline \
            -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=60

  test-conformance:
    name: Runtime Spec Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,all]"
      - name: Run conformance tests
        run: PYTHONPATH=src python -m pytest tests/conformance -v --tb=short

  test-console:
    name: Console Boundary Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,all]"
      - name: Run console tests
        run: PYTHONPATH=src python -m pytest tests/console -v --tb=short

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dev tools
        run: uv pip install --system ruff mypy -e ".[dev,all]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy type check (advisory)
        # Ruff is the enforced gate. mypy runs advisory: the tree carries a large
        # --strict backlog and ~56 deliberately-excluded broken-stub files, so making
        # it blocking today would just keep the job permanently red. Bringing the tree
        # to strict-clean is tracked as its own effort; this surfaces type findings
        # without blocking merges. See [tool.mypy] in pyproject.toml for exclusions.
        continue-on-error: true
        run: mypy src --ignore-missing-imports

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev,all]"
      - name: Run integration tests
        run: PYTHONPATH=src python -m pytest tests/integration -v --tb=short
