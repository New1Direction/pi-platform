# PI Platform — Deterministic Semantic Execution Kernel
# Unified package configuration.

[project]
name = "pi-platform"
version = "1.0.0"
description = "Deterministic semantic execution kernel with governance-first architecture"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["deterministic", "semantic", "execution", "governance", "audit", "replay"]
authors = [
    {name = "PI Core Team"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
needle = [
    # Pin to a specific commit hash before deploying to production:
    # "needle @ git+https://github.com/cactus-compute/needle.git@<commit-sha>"
    "needle @ git+https://github.com/cactus-compute/needle.git",
]
all = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
console = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/New1Direction/pi-platform"
Documentation = "https://github.com/New1Direction/pi-platform/tree/main/docs"
Repository = "https://github.com/New1Direction/pi-platform.git"
Issues = "https://github.com/New1Direction/pi-platform/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
# NOTE: these entries reference local-only, UNTRACKED scratch stubs (unparseable
# escaped-string blobs) that are NOT committed to the repo — a clean checkout / CI
# never sees them, so they don't ship. They are listed only so a developer who has
# the stray files locally still gets a green `ruff check`. The committed tree is
# parse-clean and enforced by `compileall` in CI + tests/conformance/
# test_no_unparseable_sources.py. Delete the local files and this block can go.
extend-exclude = [
    "src/pi_micro_agents/orchestrator/chain_cache.py",
    "src/pi_micro_agents/orchestrator/planner.py",
    "src/pi_micro_agents/orchestrator/replay.py",
    "src/pi_micro_agents/orchestrator/stream_bus.py",
    "src/pi_micro_agents/orchestrator/telemetry.py",
    "src/pi_micro_agents/pi_agent_self_reflection_checker.py",
    "src/pi_micro_agents/pi_agent_swarm_health_monitor.py",
    "src/pi_micro_agents/pi_base64_payload_inspector.py",
    "src/pi_micro_agents/pi_bigquery_trace_emitter.py",
    "src/pi_micro_agents/pi_changelog_entry_checker.py",
    "src/pi_micro_agents/pi_cloud_asset_iam_query_agent.py",
    "src/pi_micro_agents/pi_cloud_run_job_orchestrator.py",
    "src/pi_micro_agents/pi_cloud_trace_span_emitter.py",
    "src/pi_micro_agents/pi_cors_header_auditor.py",
    "src/pi_micro_agents/pi_dependency_graph_analyzer.py",
    "src/pi_micro_agents/pi_deterministic_simulator.py",
    "src/pi_micro_agents/pi_dot_env_secret_leak_checker.py",
    "src/pi_micro_agents/pi_env_var_name_convention_checker.py",
    "src/pi_micro_agents/pi_error_message_template_checker.py",
    "src/pi_micro_agents/pi_ethical_drift_detector.py",
    "src/pi_micro_agents/pi_exception_handling_sentry.py",
    "src/pi_micro_agents/pi_function_docstring_validator.py",
    "src/pi_micro_agents/pi_gemini_semantic_router.py",
    "src/pi_micro_agents/pi_hardcoded_string_detector.py",
    "src/pi_micro_agents/pi_html_form_method_auditor.py",
    "src/pi_micro_agents/pi_http_method_restrictor.py",
    "src/pi_micro_agents/pi_ip_address_range_validator.py",
    "src/pi_micro_agents/pi_json_schema_field_presence_checker.py",
    "src/pi_micro_agents/pi_jwt_expiry_checker.py",
    "src/pi_micro_agents/pi_license_header_checker.py",
    "src/pi_micro_agents/pi_log_level_enforcer.py",
    "src/pi_micro_agents/pi_loop_complexity_checker.py",
    "src/pi_micro_agents/pi_memory_compaction_checker.py",
    "src/pi_micro_agents/pi_memorystore_cache_manager.py",
    "src/pi_micro_agents/pi_mime_type_consistency_checker.py",
    "src/pi_micro_agents/pi_multi_agent_coordination_validator.py",
    "src/pi_micro_agents/pi_output_consistency_gate.py",
    "src/pi_micro_agents/pi_prompt_template_validator.py",
    "src/pi_micro_agents/pi_pubsub_event_publisher.py",
    "src/pi_micro_agents/pi_python_circular_import_detector.py",
    "src/pi_micro_agents/pi_rate_limit_header_checker.py",
    "src/pi_micro_agents/pi_readme_structure_checker.py",
    "src/pi_micro_agents/pi_regex_complexity_auditor.py",
    "src/pi_micro_agents/pi_resource_leak_scanner.py",
    "src/pi_micro_agents/pi_secret_manager_rotation_agent.py",
    "src/pi_micro_agents/pi_semver_bump_validator.py",
    "src/pi_micro_agents/pi_spanner_migration_planner.py",
    "src/pi_micro_agents/pi_sql_keyword_injection_scanner.py",
    "src/pi_micro_agents/pi_stack_trace_filter.py",
    "src/pi_micro_agents/pi_test_coverage_gate.py",
    "src/pi_micro_agents/pi_unicode_homoglyph_detector.py",
    "src/pi_micro_agents/pi_url_scheme_enforcer.py",
    "src/pi_micro_agents/pi_version_pin_enforcer.py",
    "src/pi_micro_agents/pi_vertex_embedding_generator.py",
    "src/pi_micro_agents/pi_yaml_key_duplicate_detector.py"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501", "E402", "N801", "N818"]  # legacy: import-position + naming (renames risk breaking refs)

[tool.ruff.lint.isort]
# Declare the platform's first-party namespaces explicitly. Otherwise ruff infers
# first-party from whichever packages happen to be present, so import-sort (I001)
# results differ between a full working tree and a clean checkout/CI — making the
# lint gate non-deterministic.
known-first-party = [
    "pi_agent_chain",
    "pi_agent_interceptor",
    "pi_agent_registry",
    "pi_connector_fabric",
    "pi_console",
    "pi_event_fabric",
    "pi_extension_governor",
    "pi_ide_re",
    "pi_interoperability_layer",
    "pi_micro_agents",
    "pi_production",
    "pi_runtime",
    "pi_semantic_diff",
    "pi_semantic_radius",
    "pi_semantic_validator",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B017"]
"src/pi_production/api/routes.py" = ["B008", "F401"]
"src/pi_console/cli.py" = ["F401"]
"src/pi_interoperability_layer/hyperframes.py" = ["F401"]
"tests/browser/test_fail_closed_purge.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# src/ layout: treat src as the package base so modules resolve as pi_* (not src.pi_*).
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# The broken-stub files (escaped-string-literal sources that raise SyntaxError) cannot
# be parsed; excluded here — same set as [tool.ruff] extend-exclude — so mypy can check
# the rest of the tree instead of dying on the first one. Tracked for repair/removal.
exclude = '''(?x)(
    src/pi_micro_agents/orchestrator/(chain_cache|planner|replay|stream_bus|telemetry)\.py
  | src/pi_micro_agents/pi_(agent_self_reflection_checker|agent_swarm_health_monitor|base64_payload_inspector
      |bigquery_trace_emitter|changelog_entry_checker|cloud_asset_iam_query_agent
      |cloud_run_job_orchestrator|cloud_trace_span_emitter|cors_header_auditor|dependency_graph_analyzer
      |deterministic_simulator|dot_env_secret_leak_checker|env_var_name_convention_checker
      |error_message_template_checker|ethical_drift_detector|exception_handling_sentry
      |function_docstring_validator|gemini_semantic_router|hardcoded_string_detector|html_form_method_auditor
      |http_method_restrictor|ip_address_range_validator|json_schema_field_presence_checker|jwt_expiry_checker
      |license_header_checker|log_level_enforcer|loop_complexity_checker|memory_compaction_checker
      |memorystore_cache_manager|mime_type_consistency_checker|multi_agent_coordination_validator
      |output_consistency_gate|prompt_template_validator|pubsub_event_publisher|python_circular_import_detector
      |rate_limit_header_checker|readme_structure_checker|regex_complexity_auditor|resource_leak_scanner
      |secret_manager_rotation_agent|semver_bump_validator|spanner_migration_planner
      |sql_keyword_injection_scanner|stack_trace_filter|test_coverage_gate|unicode_homoglyph_detector
      |url_scheme_enforcer|version_pin_enforcer|vertex_embedding_generator|yaml_key_duplicate_detector)\.py
  | src/pi_ide_re/(agent_selector|cli|exporter|ingest)\.py
  | src/pi_runtime/orchestrator\.py
  | src/pi_runtime/skills/.*\.py
  | src/pi_micro_agents/pi_(stub_enricher_agent|graph_delta_auditor|research_gap_identifier
      |node_prioritizer|graph_health_reporter|task_router|deep_research_promoter|surplus_orchestrator
      |graph_consistency_checker|workflow_coordinator|graph_query_engine)\.py
)'''

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/scratch/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
