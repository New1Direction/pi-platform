# PI Platform — Deterministic Semantic Execution Kernel
# Unified package configuration.

[project]
name = "pi-platform"
version = "1.0.0"
description = "Deterministic semantic execution kernel with governance-first architecture"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
keywords = ["deterministic", "semantic", "execution", "governance", "audit", "replay"]
authors = [
    {name = "PI Core Team"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
console = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/New1Direction/pi-platform"
Documentation = "https://github.com/New1Direction/pi-platform/tree/main/docs"
Repository = "https://github.com/New1Direction/pi-platform.git"
Issues = "https://github.com/New1Direction/pi-platform/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
