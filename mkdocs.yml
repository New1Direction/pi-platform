site_name: PI Platform
site_description: Deterministic semantic execution kernel with governance-first architecture
site_url: https://new1direction.github.io/pi-platform/
repo_url: https://github.com/New1Direction/pi-platform
repo_name: New1Direction/pi-platform
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/compass-outline
    repo: fontawesome/brands/github
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to blueprint (light)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to control room (dark)
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Keep build clean without forcing every legacy spec into the nav.
validation:
  nav:
    omitted_files: info
  links:
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Desktop Console:
      - console/index.md
      - Agentdex: console/agents.md
      - Party (Builder): console/builder.md
      - Battle Log (Ledger): console/ledger.md
      - Agent Forge: console/forge.md
      - Governance Compass: console/compass.md
  - Architecture:
      - Orchestrator & Routing: architecture/orchestrator-routing.md
      - Trust Tiers: architecture/trust-tiers.md
      - Ledger & Replay: architecture/ledger-replay.md
      - Repo Mapping: architecture/repo-mapping.md
  - API Reference: api-reference.md
  - Deployment: deployment.md
  - Runtime Spec (v1.4): PI-RUNTIME-SPEC-v1.4.md

plugins:
  - search
