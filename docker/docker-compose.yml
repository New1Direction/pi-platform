# PI Platform — Production Docker Compose
# Deterministic, governance-first deployment.
# All services are immutable; state lives only in SQLite WAL.

version: "3.8"

services:
  pi-core:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: pi-platform:1.2.0-prod
    container_name: pi-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PI_ENV=production
      - PI_STORAGE_PATH=/data/pi_production.db
      - PI_LOG_LEVEL=INFO
      # REQUIRED: set PI_SECRET_JWT and PI_SECRET_REQUEST_SIGNING in a .env file or
      # your deployment secrets manager before running in production.
      # Generate with: openssl rand -hex 32
      - PI_SECRET_JWT=${PI_SECRET_JWT:?PI_SECRET_JWT must be set — never use a default in production}
      - PI_SECRET_REQUEST_SIGNING=${PI_SECRET_REQUEST_SIGNING:?PI_SECRET_REQUEST_SIGNING must be set}
    volumes:
      - pi-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Bounded JSON log rotation — without this, container logs grow forever
    # and can fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: lightweight Prometheus metrics scraper.
  # Bind to loopback by default — flip to 0.0.0.0:9090 explicitly in your
  # deployment if you need it reachable from outside the host.
  pi-metrics:
    image: prom/prometheus:v2.53.0
    container_name: pi-metrics
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - pi-core
    profiles:
      - metrics

  # FreeLLMAPI OpenAI-compatible unified proxy sidecar.
  #
  # Builds a pinned, production-mode image instead of `npm install`-ing at
  # container start (which would let the lockfile drift on every restart and
  # leave dev-only tooling inside the container). To use:
  #   1. Place the freellmapi source at docker/freellmapi/ (with its own
  #      Dockerfile that does COPY package*.json . && npm ci --omit=dev).
  #   2. docker compose --profile sandbox up llm-proxy
  llm-proxy:
    build:
      context: ./freellmapi
    container_name: pi-llm-proxy
    ports:
      - "127.0.0.1:3000:3000"   # bound to loopback only
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    profiles:
      - sandbox

volumes:
  # Local volume for SQLite WAL data. In production:
  #   1. Mount a host path or network volume you can snapshot, e.g.
  #      `volumes: ["/var/lib/pi/data:/data"]`.
  #   2. Schedule `sqlite3 /data/pi_production.db ".backup '/backup/<ts>.db'"`
  #      via cron / systemd timer so backups capture a WAL-consistent snapshot.
  pi-data:
    driver: local

networks:
  default:
    name: pi-platform
